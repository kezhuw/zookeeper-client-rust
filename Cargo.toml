[package]
name = "zookeeper-client"
version = "0.12.0-dev"
edition = "2021"
authors = ["Kezhu Wang <kezhuw@gmail.com>"]
description = "ZooKeeper async client"
homepage = "https://github.com/kezhuw/zookeeper-client-rust/"
repository = "https://github.com/kezhuw/zookeeper-client-rust/"
documentation = "https://docs.rs/zookeeper-client/"
license = "MIT"
keywords = ["ZooKeeper"]
categories = ["api-bindings"]
rust-version = "1.76"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
tls = ["rustls", "rustls-webpki", "rustls-pemfile", "futures-rustls"]
fips = ["rustls?/fips"]
fips-only = ["fips"]
sasl = ["sasl-gssapi", "sasl-digest-md5"]
sasl-digest-md5 = ["rsasl/unstable_custom_mechanism", "md5", "linkme", "hex"]
sasl-gssapi = ["rsasl/gssapi"]
tokio = ["asyncs/tokio"]
smol = ["asyncs/smol"]
async-global-executor = ["asyncs/async-global-executor"]
turmoil = ["dep:turmoil", "dep:tokio-util", "tokio"]

[dependencies]
bytes = "1.12.1"
thiserror = "2.0.18"
strum = { version = "0.28", features = ["derive"] }
num_enum = "0.7.6"
ignore-result = "0.2.0"
compact_str = "0.9"
const_format = "0.2.36"
static_assertions = "1.1.0"
hashbrown = "0.16.1"
hashlink = "0.11.1"
either = "1.16.0"
uuid = { version = "1.20.0", features = ["v4"] }
rustls = { version =  "0.23.41", optional = true }
rustls-webpki = { version = "0.103.13", optional = true }
rustls-pemfile = { version = "2", optional = true }
derive-where = "1.6.1"
fastrand = "2.4.1"
tracing = "0.1.44"
rsasl = { version = "2.3.1", default-features = false, features = ["provider", "config_builder", "registry_static", "std"], optional = true }
md5 = { version = "0.8.0", optional = true }
hex = { version = "0.4.3", optional = true }
linkme = { version = "0.3", optional = true }
async-io = "2.6.0"
futures = "0.3.32"
async-net = "2.0.0"
futures-rustls = { version = "0.26.0", optional = true }
futures-lite = "2.6.1"
asyncs = "0.4.0"
tokio-util = { version = "0.7", features = ["compat"], optional = true }
turmoil = { version = "0.7.1", optional = true }

[dev-dependencies]
test-log = { version = "0.2.21", features = ["log", "trace"] }
env_logger = "0.11.11"
rand = "0.9.4"
pretty_assertions = "1.4.1"
test-case = "3"
# turn off default tls crypto provider
testcontainers = { version = "0.27.3", features = ["blocking"], default-features = false }
assertor = "0.0.4"
assert_matches = "1.5.0"
tempfile = "3.27.0"
rcgen = { version = "0.14.7", features = ["default", "x509-parser"] }
serial_test = "3.5.0"
asyncs = { version = "0.4.0", features = ["test"] }
blocking = "1.6.2"
rustls-pki-types = "1.15.0"
x509-parser = "0.18.1"
atomic-write-file = "0.2.3"
notify = "7.0.0"
test-fork = "0.1.3"
rstest = "0.26.1"

[package.metadata.cargo-all-features]
skip_optional_dependencies = true
denylist = ["tokio", "smol", "async-global-executor"]

[package.metadata.cargo-feature-combinations]
isolated_feature_sets = [
    ["tls", "sasl"],
]
include_feature_sets = [
    ["tls", "fips"],
    ["tls", "fips-only"],
]

[package.metadata.docs.rs]
all-features = true

[profile.dev]
# Need this for linkme crate to work for spawns in macOS
lto = "thin"
